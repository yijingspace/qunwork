[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qunwork"
version = "0.0.0"
description = "QunWork — provider-agnostic agentic coworker runtime (multi-agent swarm vision)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.40",  # native Claude Messages API provider
    "google-genai>=1.0",  # native Gemini provider
    "textual>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # aisuite (toolkits/tracing), pinned to the commit this repo was imported from;
    # swap for a PyPI pin ("aisuite>=x.y") once the next aisuite release ships.
    "aisuite @ git+https://github.com/andrewyng/aisuite.git@1b4bbf303ec21968230b1ec869a144d054e9b3c4",
    "docstring_parser",
    "pyyaml>=6",  # persona manifest frontmatter (YAML)
    "pydantic>=2",
    # <2 是硬约束: mcp 2.x 删掉了 streamablehttp_client(改名 streamable_http_client 且
    # 签名不同), 而 coworker/mcp/client.py:21 直接 import 旧名 —— 没有上界时 pip 会装 2.x,
    # 27 个测试文件在收集阶段就 ImportError(GitHub CI run #1 实证)。
    "mcp>=1.1,<2",  # MCP client (stdio + streamable-http); we use our own async layer on it
    "httpx>=0.27",  # sync outbound senders for messaging connectors (send_message tool)
    "websockets>=13",  # managed Slack relay client transport (relay_client.py)
    "ddgs>=9",  # keyless default web-search provider (DuckDuckGo); Tavily/Brave use httpx
    "croniter>=2",  # cron next-fire math for the automation scheduler
    # PDF attachments for models without native PDF support (pdf_support.py):
    # pypdf = pure-python text extraction; pypdfium2 = page rasterization (BSD pdfium,
    # ships its own libpdfium — NOT PyMuPDF, whose AGPL license can't ride in the DMG).
    "pypdf>=5",
    "pypdfium2>=4",
    # DOCX text extraction for the knowledge library (knowledge/extractors/docx.py).
    "python-docx>=1.1",
    # IANA tz database for zoneinfo. Windows ships no system tz db, so without this every
    # named schedule timezone (UTC, Asia/Kolkata, …) silently falls back to local time.
    "tzdata; sys_platform == 'win32'",
    # Local voice chat pipeline (coworker/voice): sherpa-onnx = VAD + streaming ASR + TTS
    # (onnxruntime-based, CPU), sounddevice = mic capture / playback. Heavy and lazy-imported,
    # so the sidecar runs fine even when these are missing.
    "sherpa-onnx>=1.13",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "httpx", "pytest-timeout>=2.3"]
# Inbound messaging listeners (outbound send_message needs only httpx, already a core dep).
# aiohttp is slack-bolt's Socket Mode transport at runtime (and the FakeSlack test harness
# drives the real handler) — declare it so CI installs it, not just transitively.
messaging = ["python-telegram-bot>=21", "slack-bolt>=1.18", "aiohttp>=3.9"]
# Interactive Cowork browser automation.
browser = ["playwright>=1.44"]
# 谱分析 / 3D 仿真 / DpNN 基线: coworker.orchestrator.convergence|mesh, hornet.sim3d|topo_embed|
# builder, periodic.dpnn_baseline 都在函数内 `import numpy`。缺失时**不报错而是静默退化**
# (代数连通度恒 0、特征值/收敛轮数全不对), 只有黄金值测试才看得见 —— 所以必须显式声明,
# CI 也装它(GitHub CI run #2: ubuntu 上 9 个 ModuleNotFoundError + 5 个谱分析断言失败)。
sim = ["numpy>=1.26"]
# 本地视觉技能 (coworker/skills/vision、skills/img2threejs/integrations/vision) 用 Pillow 读图/
# 缩放; 它此前只是被 rapidocr-onnxruntime 顺带带进来的, 谁都没声明 —— CI run #4 上 ubuntu
# 因此挂 2 个 `ModuleNotFoundError: No module named 'PIL'`(test_attachments 的图片路径)。
vision = ["Pillow>=10"]

[project.scripts]
qunwork = "coworker.cli:main"
qunwork-server = "coworker.server.run:main"
qunwork-connectors = "coworker.connectors.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coworker*"]

[tool.setuptools.package-data]
coworker = ["personas/builtin/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 卡死护栏: GitHub CI 的 windows job 曾整套**挂住**(run #2/#3/#4 都停在 Test 步骤
# 30-45 分钟不动, 而本地同一套件 11 分钟跑完), 没有超时的话一个卡死用例会一直占着
# runner 直到 6 小时上限 —— 既拿不到结论, 又白烧私有仓库的免费额度。
# thread 是 Windows 上唯一可用的方法(无法 kill, 但会先用 faulthandler 打出卡住位置的栈)。
timeout = 300
timeout_method = "thread"
