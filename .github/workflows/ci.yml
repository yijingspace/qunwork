# App CI — the coworker Python suite, the GUI unit tests, and the hermetic
# Playwright e2e suite (mocked /v1 + WS; no model or network needed).

name: CI

on: [push, pull_request]

# 同一个 ref 上新的推送直接取消上一次还没跑完的 run：Windows runner 慢, 上一版还没跑完
# 新提交就来了, 队列会一直堆(实测一次堆了 3 个 run, 且都被前面卡住的 job 拖着烧额度)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Windows 控制台默认 GBK: verify/*.py 打印 ₀₂⁻ 这类字符会 UnicodeEncodeError 而死,
# pytest 的日志同理(conftest 里另有一层兜底)。统一让 CI 用 UTF-8。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个组合失败不再取消其它组合 —— run #1 里失败先到, 其余 11 个 job 全被 cancel,
      # 只看得到一半结论。
      fail-fast: false
      matrix:
        # 私有仓库免费额度 2000 分钟/月, 而 Windows runner 按 2× 计费且明显更慢: 因此
        # 只保留一个 Windows 组合(3.13), 3.12 覆盖交给 ubuntu —— 省掉约 20 分钟/次推送。
        # macOS runner 按 10× 计费, 覆盖由 release.yml 的 dmg 构建承担。
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[messaging,dev,sim,vision]"
          pip install pytest-cov
      # -v + 显式 --timeout: Windows runner 上有个用例会卡住(run #5/#7 的超时转储里堆着几十个
      # shell reader 线程 —— 那些是**活着的外壳在等输出**, 属正常; 卡的是某个用例的主线程),
      # 而 pytest-timeout(thread) 超时会直接结束进程, 没有 -v 日志里只剩一排点号, 点不出是谁。
      - name: Test (full suite, coverage)
        run: pytest tests -v --timeout=180 --cov=coworker --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60
      # 7×24 长程任务架构回归 (五大突破 + 管理控制台 + 压力场景)。
      - name: Test (7×24 long-run suite)
        run: pytest tests/test_longrun.py tests/test_stress_longrun.py -q
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

  # 7×24 突破方案数学模型验证 (分形检查点 / LoopCoop 收敛 / 皮萨诺压缩 /
  # 蜂巢心跳 / 分形降级 — verify/run_all.py, 全过才绿)。
  #
  # 两个 OIR 脚本依赖仓库外条件(活着的网关 / 不在本仓库的 oir_longrun_driver), 现在由
  # run_all.py 做环境门控: 缺条件记 SKIP 并打印原因。此前它们在**任何**环境都 FAIL, 让这个
  # 门禁永远红着(run #1-#5 实证), 于是没人再看它; 现在 5 个数学脚本 PASS + 2 SKIP = 绿。
  # (中途曾用 continue-on-error 让它不阻塞; 门控到位后已收回, 恢复成硬门禁。)
  verify-7x24:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[messaging,dev,sim,vision]"
      - name: Verify (five breakthroughs)
        working-directory: .
        run: python verify/run_all.py
      - name: Verify (each script independently)
        shell: bash
        run: |
          for s in verify_checkpoint_fractal verify_convergence_loopcoop \
                   verify_compress_pisano verify_heartbeat_honeycomb \
                   verify_degradation_fractal; do
            python "verify/$s.py"
          done

  gui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Unit tests
        working-directory: surfaces/gui
        run: npm test
      - name: Typecheck + production build
        # tsc 与真实打包走同一条命令: 单元测试绿但类型/打包炸的情况以前只有本地能看到。
        working-directory: surfaces/gui
        run: npm run build

  gui-e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Install Playwright browsers
        working-directory: surfaces/gui
        run: npx playwright install --with-deps chromium
      - name: e2e
        working-directory: surfaces/gui
        run: npm run e2e
